[pytest]
addopts = -q --reruns=2
testpaths = tests
markers =
    smoke: quick smoke tests
    regression: full regression

# Note: --reruns=2 causes pytest-rerunfailures to retry failed tests up to 2 times.
title=REPORT_TITLE_HERE
python_files = Sect_*.py
python_functions = ID_*
addopts = -ra -q --tb=native --cache-clear -s
json-report-file = logs/output.json
html-report = logs/report.html
log_file = logs/pytest-logs.txt
log_cli=true
log_level=INFO
; log_level=DEBUG
; log_level=WARNING
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %I:%M:%S %p
;log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S %p
console_output_style = classic
xfail_strict = false
pythonpath= .
testpaths =
	UWC/tests
filterwarnings =
	error::ResourceWarning
	default::DeprecationWarning
	ignore
	ignore::RuntimeWarning
	ignore::DeprecationWarning